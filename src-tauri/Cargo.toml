[package]
name = "kaolin-assets"
version = "0.1.0"
description = "Kaolin-Assets · 高岭土机理图绘制软件"
authors = ["Kaolin-Assets 课题组"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
